<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"artist","type":"string","label":"Artist","default":"AIDAN B."},
    {"id":"title1","type":"string","label":"Title line 1","default":"MidNight"},
    {"id":"title2","type":"string","label":"Title line 2","default":"Kiss"},
    {"id":"credit","type":"string","label":"Credit line","default":"with Aishyla"},
    {"id":"gold","type":"color","label":"Accent (artist name)","default":"#FF5FD2"},
    {"id":"ink","type":"color","label":"Title colour","default":"#F7EEDD"}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      /* End card for the music video: played after the song ends. Midnight blue with magenta
         and cyan neon, the treatment's night city. */
      :root {
        --gold: #ff5fd2;
        --ink: #f7eedd;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: #04050c;
      }
      #root {
        width: 100%;
        height: 100%;
        background: radial-gradient(ellipse 1400px 900px at 50% 40%, #141a3c 0%, #04050c 70%);
      }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="10" data-width="1920" data-height="1080">
      <div
        id="vfx-anamorphic-flare"
        data-composition-id="vfx-anamorphic-flare"
        data-composition-src="compositions/vfx-anamorphic-flare.html"
        data-start="0"
        data-duration="10"
        data-track-index="0"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"backdrop":"transparent","tint":"#5fd0ff","emitters":46,"intensity":7,"timeScale":0.3,"streakLength":3,"hue":270,"hueSpread":80}'
        style="z-index: 0"
      ></div>
      <div
        id="endcard"
        data-composition-id="endcard"
        data-composition-src="compositions/endcard.html"
        data-start="0"
        data-duration="10"
        data-track-index="1"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        style="z-index: 1"
      ></div>
      <div
        id="logo"
        data-composition-id="logo"
        data-composition-src="compositions/logo.html"
        data-start="5.2"
        data-duration="4.8"
        data-track-index="2"
        data-track-kind="graphics"
        data-width="1920"
        data-height="1080"
        data-variable-values='{"tagline":"","hold":20}'
        style="z-index: 2"
      ></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      tl.fromTo("#vfx-anamorphic-flare", { opacity: 0 }, { opacity: 0.8, duration: 2.0, ease: "power1.out" }, 0.4);
      // The logo sits above the end card, so it fades with the end card's fade to black.
      tl.to("#logo", { opacity: 0, duration: 1.3, ease: "power1.in" }, 8.55);
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
